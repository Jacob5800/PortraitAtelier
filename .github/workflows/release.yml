name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development SDK
        shell: pwsh
        run: |
          $sdkPath = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $sdkPath | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile 'dalamud-sdk.zip'
          Expand-Archive -Path 'dalamud-sdk.zip' -DestinationPath $sdkPath -Force

      - name: Restore
        run: dotnet restore PortraitAtelier.csproj

      - name: Build and package
        run: dotnet build PortraitAtelier.csproj --no-restore --configuration Release

      - name: Publish release asset
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Release/PortraitAtelier/latest.zip
          fail_on_unmatched_files: true
